name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        # with:
        #   node-version: 22        # SHBlog 要22+；Lonetrail v6也22.12+；不写默认较新LTS
        #   package-manager: pnpm@10 # 用 pnpm 锁定版本；不写按 lockfile 自动检测
        #   build-cmd: pnpm run build
        #   out-dir: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5