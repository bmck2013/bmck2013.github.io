name: Deploy to GitHub Pages

on:
  push:
    branches: [main]      # 如果你默认分支是 master，改成 master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install, build and upload
        uses: withastro/action@v6
        with:
          package-manager: pnpm@latest   # 模板有 pnpm-lock.yaml，也可不写让它自动识别
          # node-version: 20              # 构建报 Node 版本再开这个
          # build-cmd: pnpm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5